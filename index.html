<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Expenses</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="prevMonth" aria-label="Previous month">&#8249;</button>
  <div class="month-wrap">
    <h1 id="monthLabel"></h1>
    <div id="monthTotal" class="total"></div>
  </div>
  <button id="nextMonth" aria-label="Next month">&#8250;</button>
</header>

<nav>
  <button class="tab active" data-tab="list">Expenses</button>
  <button class="tab" data-tab="summary">Summary</button>
  <button class="tab" data-tab="settings">Settings</button>
</nav>

<main>
  <section id="tab-list" class="panel active">
    <div id="list"></div>
    <p id="empty" class="muted center" hidden>No expenses this month yet.<br>Tap + to add one.</p>
  </section>

  <section id="tab-summary" class="panel">
    <h2>By category</h2>
    <div id="catSummary"></div>
    <h2>Last 6 months</h2>
    <div id="trend"></div>
  </section>

  <section id="tab-settings" class="panel">
    <h2>Currency</h2>
    <input id="currency" maxlength="4" placeholder="$">
    <h2>Categories</h2>
    <div id="catList"></div>
    <form id="catForm" class="row">
      <input id="newCat" placeholder="New category" required>
      <button type="submit" class="btn">Add</button>
    </form>
    <h2>Your data</h2>
    <p class="muted">Everything is stored only on this device. Export a backup regularly.</p>
    <div class="row">
      <button id="exportCsv" class="btn secondary">Export CSV</button>
      <button id="exportJson" class="btn secondary">Backup (JSON)</button>
    </div>
    <div class="row">
      <label class="btn secondary file">Restore backup<input type="file" id="importJson" accept=".json" hidden></label>
      <button id="wipe" class="btn danger">Delete all</button>
    </div>
  </section>
</main>

<button id="fab" aria-label="Add expense">+</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add expense</h2>
    <label>Amount<input id="amount" type="number" inputmode="decimal" step="0.01" min="0" required></label>
    <label>Category<select id="category" required></select></label>
    <label>Date<input id="date" type="date" required></label>
    <label>Note<input id="note" placeholder="Optional"></label>
    <div class="row">
      <button type="button" id="cancel" class="btn secondary">Cancel</button>
      <button type="button" id="delete" class="btn danger" hidden>Delete</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
